<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PréventIA-LaB · Étude de poste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --navy:oklch(0.30 0.055 250);
  --navy-900:oklch(0.22 0.05 252);
  --navy-700:oklch(0.38 0.06 250);
  --teal:oklch(0.66 0.10 195);
  --teal-600:oklch(0.58 0.10 196);
  --teal-050:oklch(0.96 0.02 195);
  --orange:oklch(0.72 0.16 55);
  --orange-600:oklch(0.66 0.16 50);
  --orange-050:oklch(0.96 0.03 60);
  --ink:oklch(0.26 0.02 250);
  --muted:oklch(0.52 0.02 250);
  --line:oklch(0.90 0.01 250);
  --bg:oklch(0.985 0.004 250);
  --card:#ffffff;
  --green:oklch(0.72 0.15 150);
  --yellow:oklch(0.85 0.14 95);
  --amber:oklch(0.75 0.15 65);
  --red:oklch(0.62 0.20 25);
  --black-band:oklch(0.30 0.03 25);
  --radius:14px;
  --radius-sm:9px;
  --shadow:0 1px 2px oklch(0.3 0.05 250 / .06), 0 8px 24px oklch(0.3 0.05 250 / .07);
  --shadow-sm:0 1px 2px oklch(0.3 0.05 250 / .08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"DM Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"DM Sans",sans-serif;margin:0}
.serif{font-family:"DM Serif Display",serif;font-weight:400}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--teal-600)}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.rail{background:var(--navy-900);color:oklch(0.92 0.01 250);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.brand{padding:22px 20px 16px;border-bottom:1px solid oklch(0.4 0.04 250 /.4)}
.brand .logo{display:flex;align-items:center;gap:10px}
.brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--teal),var(--orange));display:grid;place-items:center;font-weight:700;color:var(--navy-900);font-size:15px}
.brand .t{font-family:"DM Serif Display",serif;font-size:19px;letter-spacing:.2px;line-height:1}
.brand .s{font-size:11px;color:oklch(0.72 0.03 200);letter-spacing:.6px;text-transform:uppercase;margin-top:3px}
.steps{list-style:none;margin:0;padding:12px 10px;overflow-y:auto;flex:1}
.steps li{margin:2px 0}
.step-btn{width:100%;display:flex;align-items:center;gap:12px;background:transparent;border:0;color:oklch(0.82 0.02 250);padding:10px 12px;border-radius:10px;text-align:left;font-size:14px;transition:.15s}
.step-btn .num{width:24px;height:24px;border-radius:7px;background:oklch(0.4 0.04 250 /.5);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none;color:oklch(0.9 0.01 250)}
.step-btn:hover{background:oklch(0.4 0.04 250 /.35);color:#fff}
.step-btn.active{background:linear-gradient(90deg,oklch(0.66 0.10 195 /.22),transparent);color:#fff}
.step-btn.active .num{background:var(--teal);color:var(--navy-900)}
.step-btn.done .num{background:var(--green);color:oklch(0.2 0.05 150)}
.rail-foot{padding:14px;border-top:1px solid oklch(0.4 0.04 250 /.4);font-size:11px;color:oklch(0.66 0.02 250)}
.score-mini{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.score-mini .dot{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:14px}

/* ---------- Main ---------- */
.main{display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 30px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar .crumb{font-size:12px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.topbar h2{font-size:20px;font-family:"DM Serif Display",serif;font-weight:400;margin-top:2px}
.tb-actions{display:flex;gap:8px;flex-wrap:wrap}
.content{padding:26px 30px 90px;max-width:1180px;width:100%;margin:0 auto}

/* ---------- Buttons ---------- */
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;border-radius:10px;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.btn:hover{border-color:var(--teal);color:var(--teal-600)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-700);color:#fff}
.btn.accent{background:var(--orange);border-color:var(--orange);color:oklch(0.25 0.05 50)}
.btn.accent:hover{background:var(--orange-600);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--teal-050);color:var(--teal-600)}
.btn.sm{padding:6px 10px;font-size:12.5px}

/* ---------- Cards / layout ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.card.pad{padding:22px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}}
.sec-title{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sec-title .ic{width:30px;height:30px;border-radius:8px;background:var(--teal-050);display:grid;place-items:center;font-size:15px}
.sec-title h3{font-size:16px}
.sub{color:var(--muted);font-size:13px}
.eyebrow{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--teal-600);font-weight:600}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12.5px;font-weight:600;color:var(--navy-700)}
.field input,.field select,.field textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);transition:.15s;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-050)}
.field .hint{font-size:11.5px;color:var(--muted)}

/* Combobox */
.combo{position:relative}
.combo .picked{display:none;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--teal);background:var(--teal-050);border-radius:10px}
.combo .picked.on{display:flex}
.combo .picked .code{font-weight:700;color:var(--teal-600);font-size:13px}
.combo .picked .lib{flex:1;font-size:13.5px}
.combo .picked .x{border:0;background:transparent;color:var(--muted);font-size:16px}
.combo .drop{position:absolute;z-index:40;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:300px;overflow:auto;display:none}
.combo .drop.on{display:block}
.combo .opt{padding:10px 12px;border-bottom:1px solid var(--bg);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.combo .opt:hover{background:var(--teal-050)}
.combo .opt .code{font-weight:700;font-size:12px;color:var(--teal-600);min-width:52px}
.combo .opt .lib{font-size:13px}
.combo .opt small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.combo .empty{padding:14px;color:var(--muted);font-size:13px}

/* ---------- Risk sliders ---------- */
.fam{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px;background:#fff}
.fam-head{display:flex;align-items:center;gap:12px;padding:12px 16px;background:oklch(0.98 0.006 250);cursor:pointer}
.fam-head .ic{font-size:18px}
.fam-head .nm{font-weight:600;flex:1}
.fam-head .badge{font-size:12px;font-weight:700;color:#fff;padding:3px 10px;border-radius:20px}
.fam-head .chev{color:var(--muted);transition:.2s}
.fam.open .chev{transform:rotate(90deg)}
.fam-body{display:none;padding:8px 16px 16px}
.fam.open .fam-body{display:block}
.ritem{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;padding:9px 0;border-top:1px solid var(--bg)}
.ritem:first-child{border-top:0}
.ritem .lbl{font-size:13.5px}
.levels{display:flex;gap:5px}
.lvl{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:600;color:var(--muted);transition:.12s}
.lvl:hover{border-color:var(--teal)}
.lvl.on0{background:oklch(0.94 0.01 250);border-color:oklch(0.85 0.01 250);color:var(--ink)}
.lvl.on1{background:var(--yellow);border-color:var(--yellow);color:oklch(0.35 0.06 95)}
.lvl.on2{background:var(--amber);border-color:var(--amber);color:#fff}
.lvl.on3{background:var(--red);border-color:var(--red);color:#fff}

/* ---------- Tables ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;background:oklch(0.98 0.005 250)}
td input,td select{border:1px solid var(--line);border-radius:8px;padding:7px 8px;width:100%}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
.pill.ok{background:oklch(0.94 0.06 150);color:oklch(0.4 0.1 150)}
.pill.warn{background:var(--orange-050);color:var(--orange-600)}
.pill.no{background:oklch(0.95 0.05 25);color:var(--red)}

/* ---------- Ergo ---------- */
.ergo-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
@media(max-width:950px){.ergo-grid{grid-template-columns:1fr}}
.ergo-card{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff}
.ergo-card h4{font-size:14px;display:flex;align-items:center;justify-content:space-between}
.ergo-res{margin-top:12px;padding:12px;border-radius:10px;text-align:center;background:oklch(0.98 0.005 250)}
.ergo-res .val{font-family:"DM Serif Display",serif;font-size:34px;line-height:1}
.ergo-res .lab{font-size:12px;font-weight:600;margin-top:4px}
.mini-field{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;font-size:13px;border-top:1px solid var(--bg)}
.mini-field:first-child{border-top:0}
.mini-field select{width:120px;padding:5px 8px}

/* ---------- Restitution tabs ---------- */
.rtabs{display:flex;gap:6px;background:oklch(0.96 0.006 250);padding:5px;border-radius:12px;margin-bottom:20px;flex-wrap:wrap}
.rtab{border:0;background:transparent;padding:10px 16px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted)}
.rtab.active{background:#fff;color:var(--navy);box-shadow:var(--shadow-sm)}

/* ---------- A4 synthèse ---------- */
.a4{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);width:210mm;max-width:100%;margin:0 auto;padding:14mm 14mm 10mm}
.a4 .a4-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:14px}
.a4 .a4-head .ttl{font-family:"DM Serif Display",serif;font-size:22px;color:var(--navy)}
.a4 .a4-head .meta{font-size:11px;color:var(--muted);text-align:right;line-height:1.6}
.a4 h5{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--teal-600);margin:0 0 6px;font-weight:700}
.a4 .block{margin-bottom:12px}
.a4 .idcard{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 14px;font-size:11.5px}
.a4 .idcard b{display:block;color:var(--muted);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.3px}
.a4 table{font-size:10.5px}
.a4 th,.a4 td{padding:5px 7px}
.a4 .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.a4 .cols3{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}

/* ---------- Cockpit ---------- */
.cockpit{background:linear-gradient(180deg,oklch(0.22 0.05 252),oklch(0.26 0.05 250));border-radius:16px;padding:20px;color:oklch(0.94 0.01 250)}
.cock-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.cock-head .t{font-family:"DM Serif Display",serif;font-size:20px;color:#fff}
.cock-filters{display:flex;gap:8px;flex-wrap:wrap}
.cock-filters .chip{background:oklch(0.4 0.04 250 /.5);border:1px solid oklch(0.5 0.04 250 /.5);color:oklch(0.9 0.01 250);padding:5px 11px;border-radius:20px;font-size:12px}
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
@media(max-width:1000px){.kpi-row{grid-template-columns:repeat(2,1fr)}}
.kpi{background:oklch(0.3 0.04 250 /.55);border:1px solid oklch(0.45 0.04 250 /.4);border-radius:12px;padding:13px 15px}
.kpi .k-lab{font-size:11px;color:oklch(0.78 0.02 250);text-transform:uppercase;letter-spacing:.4px}
.kpi .k-val{font-family:"DM Serif Display",serif;font-size:30px;line-height:1.1;margin-top:5px}
.kpi .k-val small{font-size:14px;color:oklch(0.75 0.02 250)}
.kpi .k-tag{font-size:11px;font-weight:600;margin-top:4px}
.cock-grid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:12px}
@media(max-width:1000px){.cock-grid{grid-template-columns:1fr}}
.panel{background:oklch(0.3 0.04 250 /.5);border:1px solid oklch(0.45 0.04 250 /.35);border-radius:12px;padding:14px}
.panel h4{font-size:12.5px;color:oklch(0.86 0.02 250);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.panel.wide{grid-column:1/-1}
.rag{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid oklch(0.45 0.04 250 /.3);font-size:12.5px}
.rag:first-of-type{border-top:0}
.rag .d{width:11px;height:11px;border-radius:50%;flex:none}
.cock-table{width:100%;font-size:12px;color:oklch(0.9 0.01 250)}
.cock-table th{background:transparent;color:oklch(0.72 0.02 250)}
.cock-table td,.cock-table th{border-color:oklch(0.45 0.04 250 /.3);padding:6px 8px}

/* gauge / svg helpers */
.gauge-wrap{text-align:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

.notice{background:var(--orange-050);border:1px solid oklch(0.85 0.06 60);border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--orange-600)}
.footnav{position:fixed;bottom:0;left:260px;right:0;background:#fff;border-top:1px solid var(--line);padding:12px 30px;display:flex;justify-content:space-between;align-items:center;z-index:15}
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;width:78%;max-width:300px;transform:translateX(-100%);transition:.25s;z-index:60}
  .rail.open{transform:none}
  .footnav{left:0}
  .content{padding:20px 16px 90px}
  .topbar{padding:14px 16px}
}
.menu-btn{display:none}
@media(max-width:820px){.menu-btn{display:inline-flex}}
.scrim{position:fixed;inset:0;background:oklch(0.2 0.05 250 /.5);display:none;z-index:55}
.scrim.on{display:block}

/* ---------- Print ---------- */
@media print{
  .rail,.topbar,.footnav,.rtabs,.no-print{display:none!important}
  .app{grid-template-columns:1fr}
  .content{padding:0;max-width:none}
  .a4{border:0;box-shadow:none;border-radius:0;width:auto;padding:0}
  .cockpit{background:#fff;color:#000;border:0}
  .kpi,.panel{background:#fff;border:1px solid #ccc;color:#000}
  .panel h4,.kpi .k-lab,.cock-table th{color:#333}
  @page{size:A4;margin:12mm}
}
</style>
</head>
<body>
<div class="scrim" id="scrim" onclick="toggleRail(false)"></div>
<div class="app">
  <!-- ================= RAIL ================= -->
  <aside class="rail" id="rail">
    <div class="brand">
      <div class="logo">
        <div class="mark">PL</div>
        <div>
          <div class="t">PréventIA<span style="color:var(--orange)">·</span>LaB</div>
          <div class="s">Étude de poste</div>
        </div>
      </div>
    </div>
    <ul class="steps" id="steps"></ul>
    <div class="rail-foot">
      <div class="score-mini">
        <div class="dot" id="railDot">--</div>
        <div>
          <div style="font-weight:600;color:#fff;font-size:12.5px" id="railBand">Score PréventIA</div>
          <div id="railHint">à compléter</div>
        </div>
      </div>
      <div>Traitement 100 % local · aucune donnée transmise</div>
    </div>
  </aside>

  <!-- ================= MAIN ================= -->
  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn ghost menu-btn" onclick="toggleRail(true)">☰</button>
        <div>
          <div class="crumb" id="crumb">Étape 1 / 7</div>
          <h2 id="stepTitle">Identification du poste</h2>
        </div>
      </div>
      <div class="tb-actions">
        <button class="btn sm" onclick="saveJSON()">💾 Enregistrer</button>
        <button class="btn sm" onclick="document.getElementById('loadFile').click()">📂 Charger</button>
        <button class="btn sm" onclick="resetAll()">↺ Nouveau</button>
        <input type="file" id="loadFile" accept="application/json" style="display:none" onchange="loadJSON(event)">
      </div>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>

<div class="footnav">
  <button class="btn" id="prevBtn" onclick="go(-1)">← Précédent</button>
  <div class="sub" id="footHint"></div>
  <button class="btn primary" id="nextBtn" onclick="go(1)">Suivant →</button>
</div>

<script>
/* =========================================================
   PréventIA-LaB · Étude de poste
   Données NAF / PCS + profils de risques adaptés par métier
   (structure identique à la fiche d'entreprise : la base réelle
    naf-codes.json / pcs2020.json est chargée si présente à côté
    du fichier, sinon on utilise le référentiel embarqué ci-dessous)
   ========================================================= */

/* ---- Familles de risques (8) + items ---- */
const FAMILLES = [
 {key:'tms',nom:'TMS – Troubles musculosquelettiques',ic:'🦴',items:['Manutention manuelle de charges','Postures contraignantes','Gestes répétitifs','Bras au-dessus des épaules','Effort de poussée / traction','Vibrations mains-bras']},
 {key:'chimique',nom:'Risque chimique',ic:'⚗️',items:['Agents CMR (cancéro/muta/repro)','Solvants / vapeurs','Poussières inhalables','Fumées / aérosols','Contact cutané produits','Produits d’entretien / désinfectants']},
 {key:'biologique',nom:'Risque biologique',ic:'🧫',items:['Contact fluides biologiques (AES)','Agents infectieux','Soins / contact patients','Déchets contaminés (DASRI)','Contact animaux / milieux souillés']},
 {key:'physique',nom:'Risque physique',ic:'🌡️',items:['Bruit','Vibrations corps entier','Ambiances thermiques (chaud/froid)','Rayonnements','Éclairage inadapté','Travail en hauteur']},
 {key:'psychosocial',nom:'Risques psychosociaux (RPS)',ic:'🧠',items:['Charge mentale / pression temporelle','Faible autonomie / marge de manœuvre','Tensions relationnelles / conflits','Manque de reconnaissance','Contact public / agressivité','Insécurité de l’emploi']},
 {key:'organisationnel',nom:'Risque organisationnel',ic:'🗂️',items:['Horaires atypiques / travail de nuit','Cadence imposée','Polyvalence excessive','Interruptions fréquentes','Travail isolé']},
 {key:'accidentel',nom:'Risque accidentel',ic:'⚠️',items:['Chute de plain-pied','Chute de hauteur','Machines / outils tranchants','Circulation / véhicules','Risque électrique','Coupures / chocs / projections']},
 {key:'environnemental',nom:'Environnement de travail',ic:'🏭',items:['Espace de travail exigu','Encombrement / rangement','Sol glissant / dénivelé','Ventilation insuffisante','Nuisances extérieures']}
];
const FAM_POIDS={tms:1.3,chimique:1.2,biologique:1.15,physique:1.0,psychosocial:1.2,organisationnel:1.0,accidentel:1.15,environnemental:0.9};

/* Déduit un secteur PROFILS à partir du libellé + mots-clés (pour garder les profils quand on charge le JSON) */
function guessSecteur(txt){
  const t=(txt||'').toLowerCase();
  const has=(...w)=>w.some(x=>t.includes(x));
  if(has('petite enfance','crèche','creche','assistant maternel','assistante maternel','atsem','jeunes enfants')) return 'petite_enfance';
  if(has('aide à domicile','aide a domicile','auxiliaire de vie','service à la personne','service a la personne','aide ménager','aide menager')) return 'aide_domicile';
  if(has('hôpital','hopital','hospital','soin','infirm','aide-soignant','aide soignant','médic','medic','clinique','ehpad','ambulanc','dentaire','pharmac','santé','sante','kiné','kine','brancardier')) return 'sante';
  if(has('bâtiment','batiment','maçon','macon','gros œuvre','gros oeuvre','chantier','construction','couvreur','charpent','plaquiste','terrassement','travaux publics','btp')) return 'btp';
  if(has('restaurant','restauration','cuisine','serveur','hôtel','hotel','hôtellerie','hotellerie','café','cafe','commis','plonge')) return 'hcr';
  if(has('transport','chauffeur','conducteur','routier','livraison','livreur','ambulanci')) return 'transport';
  if(has('logistique','entrepôt','entrepot','manutention','cariste','préparateur de commande','preparateur de commande','magasinier')) return 'logistique';
  if(has('agroaliment','abattoir','boulanger','boucher','charcut','transformation alimentaire','laiterie','fromager')) return 'agroalim';
  if(has('commerce','vente','vendeur','vendeuse','caisse','caissier','magasin','supermarché','supermarche','grande distribution')) return 'commerce';
  return '';
}
/* Charger la base réelle si présente (naf-codes.json / pcs2020.json) */
(async function loadRealBase(){
  const map=x=>{const code=(x.c||x.code||x.ape||'').trim();const lib=x.l||x.libelle||x.lib||x.label||'';const kw=x.kw||'';const sec=x.secteur||x.sec||guessSecteur(lib+' '+kw);return{code,lib,sec,kw};};
  try{const r=await fetch('naf-codes.json');if(r.ok){const d=await r.json();
    const arr=Array.isArray(d)?d:(d.codes||[]);
    const m=arr.map(map).filter(x=>x.code); if(m.length)NAF=m;
  }}catch(e){}
  try{const r=await fetch('pcs2020.json');if(r.ok){const d=await r.json();
    const arr=Array.isArray(d)?d:(d.professions||d.codes||[]);
    const m=arr.map(map).filter(x=>x.code); if(m.length)PCS=m;
  }}catch(e){}
  if(step===0)rPoste();
})();

   SCORING PréventIA
   ========================================================= */
function famScore(key){const v=E.risques[key]||[];if(!v.length)return 0;const s=v.reduce((a,b)=>a+b,0);return Math.round(s/(v.length*3)*100);}
function famScores(){const o={};FAMILLES.forEach(f=>o[f.key]=famScore(f.key));return o;}

function ergoScore(){
  const reba=rebaScore().final; // 1-15
  const rula=rulaScore().final; // 1-7
  const li=nioshScore().li;      // lifting index
  const rebaN=clamp((reba-1)/14*100,0,100);
  const rulaN=clamp((rula-1)/6*100,0,100);
  const liN=clamp(li/3*100,0,100);
  return Math.round(Math.max(rebaN,rulaN,liN));
}
function compatData(){
  let non=0,adapt=0,tot=0;
  Object.values(E.capacites).forEach(s=>{if(s==='non')non++;else if(s==='adapt')adapt++;if(s&&s!=='nc')tot++;});
  return {non,adapt,tot};
}
function compatScore(){const c=compatData();const base=CAPACITES.length;return Math.round(clamp((c.non*100+c.adapt*45)/(base*100)*100*2.2,0,100));}

function globalScore(){
  const fs=famScores();let num=0,den=0;
  FAMILLES.forEach(f=>{num+=fs[f.key]*FAM_POIDS[f.key];den+=FAM_POIDS[f.key];});
  const risk=num/den;
  const g=0.58*risk+0.27*ergoScore()+0.15*compatScore();
  return Math.round(clamp(g,0,100));
}
function band(s){
  if(s<=20)return{lab:'Faible',col:'var(--green)',hex:'#1f9d55',k:'faible'};
  if(s<=40)return{lab:'Surveillance',col:'var(--yellow)',hex:'#d6b400',k:'surv'};
  if(s<=60)return{lab:'Amélioration nécessaire',col:'var(--amber)',hex:'#e58a2a',k:'amel'};
  if(s<=80)return{lab:'Risque élevé',col:'var(--red)',hex:'#d23f2f',k:'eleve'};
  return{lab:'Situation critique',col:'var(--black-band)',hex:'#4a2320',k:'crit'};
}

 [3,4,4,4,5,6,7,8,8,9,9,9],[4,4,4,5,6,7,8,8,9,9,9,9],[6,6,6,7,8,8,9,9,10,10,10,10],
 [7,7,7,8,9,9,9,10,10,11,11,11],[8,8,8,9,10,10,10,10,10,11,11,11],[9,9,9,10,10,10,11,11,11,12,12,12],
 [10,10,10,11,11,11,11,12,12,12,12,12],[11,11,11,11,12,12,12,12,12,12,12,12],[12,12,12,12,12,12,12,12,12,12,12,12]
];
function rebaScore(){
  const r=E.ergo.reba;
  let a=REBA_A[clamp(r.neck,1,3)-1][clamp(r.trunk,1,5)-1][clamp(r.legs,1,4)-1]+r.load;
  let b=REBA_B[clamp(r.la,1,2)-1][clamp(r.ua,1,6)-1][clamp(r.wr,1,3)-1]+r.coupling;
  a=clamp(a,1,12);b=clamp(b,1,12);
  let c=REBA_C[a-1][b-1];
  const final=clamp(c+r.activity,1,15);
  let niv,col;
  if(final===1){niv='Négligeable';col='var(--green)';}
  else if(final<=3){niv='Faible';col='var(--green)';}
  else if(final<=7){niv='Moyen — investiguer';col='var(--amber)';}
  else if(final<=10){niv='Élevé — action rapide';col='var(--red)';}
  else{niv='Très élevé — action immédiate';col='var(--black-band)';}
  return{scoreA:a,scoreB:b,c,final,niv,col};
}

const RULA_A=[ // [ua-1][la-1] -> wrist(1-4) x twist(1-2)
 [[[1,2],[2,2],[2,3],[3,3]],[[2,2],[2,2],[3,3],[3,3]],[[2,3],[3,3],[3,3],[4,4]]],
 [[[2,3],[3,3],[3,4],[4,4]],[[3,3],[3,3],[3,4],[4,4]],[[3,4],[4,4],[4,4],[5,5]]],
 [[[3,3],[4,4],[4,4],[5,5]],[[3,4],[4,4],[4,4],[5,5]],[[4,4],[4,4],[4,5],[5,5]]],
 [[[4,4],[4,4],[4,5],[5,5]],[[4,4],[4,4],[4,5],[5,5]],[[4,4],[4,5],[5,5],[6,6]]],
 [[[5,5],[5,5],[5,6],[6,7]],[[5,6],[6,6],[6,7],[7,7]],[[6,6],[6,7],[7,7],[7,8]]],
 [[[7,7],[7,7],[7,8],[8,9]],[[8,8],[8,8],[8,9],[9,9]],[[9,9],[9,9],[9,9],[9,9]]]
];
const RULA_B=[ // [neck-1][trunk-1] -> legs(1-2)
 [[1,3],[2,3],[3,4],[5,5],[6,6],[7,7]],
 [[2,3],[2,3],[4,5],[5,5],[6,7],[7,7]],
 [[3,3],[3,4],[4,5],[5,6],[6,7],[7,7]],
 [[5,5],[5,6],[6,7],[7,7],[7,7],[8,8]],
 [[7,7],[7,7],[7,8],[8,8],[8,8],[8,8]],
 [[8,8],[8,8],[8,8],[8,9],[9,9],[9,9]]
];
const RULA_C=[
 [1,2,3,3,4,5,5],[2,2,3,4,4,5,5],[3,3,3,4,4,5,6],[3,3,3,4,5,6,6],
 [4,4,4,5,6,7,7],[4,4,5,6,6,7,7],[5,5,6,6,7,7,7],[5,5,6,7,7,7,7]
];
function rulaScore(){
  const r=E.ergo.rula;
  let a=RULA_A[clamp(r.ua,1,6)-1][clamp(r.la,1,3)-1][clamp(r.wr,1,4)-1][clamp(r.tw,1,2)-1];
  let c=clamp(a+r.muscleA+r.forceA,1,8);
  let b=RULA_B[clamp(r.neck,1,6)-1][clamp(r.trunk,1,6)-1][clamp(r.legs,1,2)-1];
  let d=clamp(b+r.muscleB+r.forceB,1,7);
  const final=RULA_C[c-1][d-1];
  let niv,col;
  if(final<=2){niv='Acceptable';col='var(--green)';}
  else if(final<=4){niv='À surveiller';col='var(--amber)';}
  else if(final<=6){niv='Modifier bientôt';col='var(--red)';}
  else{niv='Modifier immédiatement';col='var(--black-band)';}
  return{scoreC:c,scoreD:d,final,niv,col};
}
/* ---------- NIOSH ---------- */
function nioshScore(){
  const n=E.ergo.niosh, LC=23;
  const H=clamp(n.H,25,63), V=clamp(n.V,0,175), D=clamp(n.D,25,175), A=clamp(n.A,0,135);
  const HM=clamp(25/H,0,1);
  const VM=clamp(1-0.003*Math.abs(V-75),0,1);
  const DM=clamp(0.82+4.5/D,0,1);
  const AM=clamp(1-0.0032*A,0,1);
  const FMtab={'0.2':0.85,'1':0.75,'5':0.60,'10':0.45}; const FM=FMtab[n.F]??0.75;
  const CMtab={'bonne':1.0,'moyenne':0.95,'mauvaise':0.90}; const CM=CMtab[n.C]??0.95;
  const rwl=LC*HM*VM*DM*AM*FM*CM;
  const li=n.poids>0?rwl>0?n.poids/rwl:9:0;
  let niv,col;
  if(li<=1){niv='Acceptable';col='var(--green)';}
  else if(li<=2){niv='Risque modéré';col='var(--amber)';}
  else if(li<=3){niv='Risque élevé';col='var(--red)';}
  else{niv='Risque très élevé';col='var(--black-band)';}
  return{rwl:Math.round(rwl*10)/10,li:Math.round(li*100)/100,niv,col,mult:{HM,VM,DM,AM,FM,CM}};
}

function svgGauge(score,opts={}){
  const b=band(score),dark=opts.dark,W=220,H=140,cx=110,cy=120,r=90;
  const a0=180,a1=0, val=a0-(a0-a1)*score/100;
  const pol=(ang)=>[cx+r*Math.cos(ang*Math.PI/180),cy+r*Math.sin(-ang*Math.PI/180+Math.PI*0)];
  function arc(from,to,color,w){
    const p1=[cx+r*Math.cos(from*Math.PI/180),cy-r*Math.sin(from*Math.PI/180)];
    const p2=[cx+r*Math.cos(to*Math.PI/180),cy-r*Math.sin(to*Math.PI/180)];

    return `<path d="M ${p1[0]} ${p1[1]} A ${r} ${r} 0 ${large} 1 ${p2[0]} ${p2[1]}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/>`;

function moy(arr){return arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0;}
function contraintes(){
  const r=E.risques;
  const P=clamp((moy(r.tms)+moy(r.physique))/2/3*100,0,100);
  const Cg=clamp(((r.psychosocial[0]||0)*0.6+(r.organisationnel[3]||0)*0.4)/3*100,0,100);
  const O=clamp(moy(r.organisationnel)/3*100,0,100);
  const Rel=clamp(moy([r.psychosocial[2],r.psychosocial[3],r.psychosocial[4]])/3*100,0,100);
  const Env=clamp(moy(r.environnemental)/3*100,0,100);
  return[{lab:'Physiques',val:P},{lab:'Cognitives',val:Cg},{lab:'Organisationnelles',val:O},{lab:'Relationnelles',val:Rel},{lab:'Environnementales',val:Env}];
}
function penibilite(){
  const r=E.risques, f=[];
  if((r.organisationnel[0]||0)>=2)f.push('Travail de nuit / horaires alternants');
  if((r.tms[2]||0)>=2)f.push('Travail répétitif');
  if((r.physique[0]||0)>=2)f.push('Bruit');
  if((r.physique[2]||0)>=2)f.push('Températures extrêmes');
  if((r.tms[0]||0)>=2)f.push('Manutention manuelle de charges');
  if((r.tms[1]||0)>=2||(r.tms[3]||0)>=2)f.push('Postures pénibles');
  if((r.chimique[0]||0)>=2)f.push('Agents chimiques dangereux / CMR');
  if((r.tms[5]||0)>=2||(r.physique[1]||0)>=2)f.push('Vibrations mécaniques');
  return{n:f.length,facteurs:f};
}

  });
  const c=compatData();
  if(c.non>0)arr.push({prio:'🔴',txt:'Étudier l’aménagement / le reclassement (tâches non compatibles)',fam:'Maintien dans l’emploi',score:80,mois:1,impact:'⭐⭐⭐⭐⭐',cout:'€€',resp:'Employeur + médecin du travail'});
  else if(c.adapt>0)arr.push({prio:'🟠',txt:'Mettre en place les adaptations de poste identifiées',fam:'Maintien dans l’emploi',score:55,mois:2,impact:'⭐⭐⭐⭐',cout:'€',resp:'Employeur'});
  return arr.sort((a,b)=>b.score-a.score);
}
function syntheseIA(){
  const fs=famScores(),g=globalScore(),b=band(g);
  const tri=Object.entries(fs).sort((a,b)=>b[1]-a[1]);
  const nom=k=>FAMILLES.find(f=>f.key===k).nom;
  const facteurs=tri.filter(x=>x[1]>=40).map(x=>`${nom(x[0])} (${x[1]}/100)`);
  const protecteurs=tri.filter(x=>x[1]<=20).map(x=>nom(x[0]).split('–')[0].split('(')[0].trim());
  const tachesDures=E.taches.filter(t=>/élev/i.test(t.effort||'')||t.compat==='no').map(t=>t.nom).filter(Boolean);
  const reba=rebaScore(),niosh=nioshScore();
  const c=compatData();
  const oublis=[];
  if((fs.psychosocial||0)===0)oublis.push('RPS non évalués — à confirmer par entretien');
  if((fs.chimique||0)===0&&/coif|indus|btp|agro|prop|agri/.test(E.poste.secteur))oublis.push('Risque chimique probable pour ce secteur');
  if((fs.biologique||0)===0&&/sante|dechet|petite/.test(E.poste.secteur))oublis.push('Risque biologique probable pour ce secteur');
  const expertise=[];
  if(reba.final>=8)expertise.push('Analyse ergonomique approfondie (REBA élevé)');
  if(niosh.li>2)expertise.push('Étude de manutention (indice de levage > 2)');
  if(c.non>0)expertise.push('Concertation médecin du travail sur le maintien dans l’emploi');
  return{
    facteurs:facteurs.length?facteurs:['Aucun facteur majeur détecté'],
    tachesDures:tachesDures.length?tachesDures:['—'],
    protecteurs:protecteurs.length?protecteurs:['—'],
    adaptations:planAction().slice(0,3).map(a=>a.txt),
    oublis:oublis.length?oublis:['—'],
    expertise:expertise.length?expertise:['—'],
    conclusion:`Poste évalué à ${g}/100 — niveau « ${b.lab.toLowerCase()} ». ${c.non>0?'Compatibilité restreinte : aménagement à étudier.':c.adapt>0?'Maintien possible sous réserve des adaptations proposées.':'Poste globalement compatible en l’état.'}`
  };
}

function onErgoPhoto(ev){
  const f=ev.target.files&&ev.target.files[0];ev.target.value='';if(!f)return;
  if(!/^image\//.test(f.type)){alert('Sélectionne un fichier image.');return;}
  compressImage(f).then(url=>{
    E.ergoPhoto=url;E.ergoPhotoNote='';rErgo();

    if(st)st.textContent='Photo prête ('+Math.round((url.length*0.75)/1024)+' Ko). Lance « Analyser (IA) » ou renseigne les angulations manuellement.';
  }).catch(e=>alert('Impossible de traiter cette image : '+e.message));
}

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const rd=new FileReader();
    rd.onerror=()=>reject(new Error('lecture du fichier'));
    rd.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('image illisible'));
      img.onload=()=>{
        let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        const m=VISION_CFG.maxDim;
        if(Math.max(w,h)>m){const r=m/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);}
        let cv=document.createElement('canvas');cv.width=w;cv.height=h;
        let ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
        let q=VISION_CFG.quality, url=cv.toDataURL('image/jpeg',q);
        const lim=VISION_CFG.maxKo*1024*4/3; // longueur base64 ≈ octets×4/3
        let guard=0;
        while(url.length>lim && guard++<7){
          q-=0.12;
          if(q<0.35){ // réduire aussi les dimensions
            const nw=Math.round(cv.width*0.85), nh=Math.round(cv.height*0.85);
            const c2=document.createElement('canvas');c2.width=nw;c2.height=nh;
            c2.getContext('2d').drawImage(cv,0,0,nw,nh);cv=c2;ctx=cv.getContext('2d');q=0.6;
          }
          url=cv.toDataURL('image/jpeg',Math.max(0.3,q));
        }
        resolve(url);
      };
      img.src=rd.result;
    };
    rd.readAsDataURL(file);
  });
}

function applyIaAngles(obj){
  const R={ua:[1,6],la:[1,3],wr:[1,4],tw:[1,2],neck:[1,6],trunk:[1,6],legs:[1,2],muscleA:[0,1],forceA:[0,3]};
  const B={neck:[1,3],trunk:[1,5],legs:[1,4],load:[0,3],ua:[1,6],la:[1,2],wr:[1,3],coupling:[0,3],activity:[0,3]};
  const put=(grp,map)=>{const src=obj[grp];if(!src||typeof src!=='object')return 0;let n=0;
    Object.entries(map).forEach(([k,[a,b]])=>{let v=src[k];if(v===undefined||v===null||v==='')return;v=Math.round(+v);if(isNaN(v))return;E.ergo[grp][k]=clamp(v,a,b);n++;});return n;};
  return put('rula',R)+put('reba',B);
}

function analyseErgoPhoto(){
  if(!E.ergoPhoto){alert('Ajoute une photo d’abord.');return;}
  const setStatus=(t,c)=>{const s=document.getElementById('photoStatus');if(s){s.innerHTML=t;s.style.color=c||'';}};
  setStatus('⏳ Analyse en cours… envoi de l’image à l’IA.','var(--teal-600)');
  const b64=(E.ergoPhoto.split(',')[1])||'';
  const prompt=`Tu es ergonome. Analyse la posture de travail de l’opérateur sur cette photo et estime, pour la posture principale, les catégories RULA et REBA selon EXACTEMENT ce codage (réponds par l’entier de la catégorie la plus proche).

RULA :
- ua (bras/épaule) : 1=0–20° | 2=20–45° | 3=45–90° | 4=>90° | 5=épaule surélevée | 6=bras en abduction
- la (avant-bras) : 1=60–100° | 2=<60° ou >100° | 3=écarté/croisé
- wr (poignet) : 1=neutre | 2=0–15° | 3=>15° | 4=extrême
- tw (torsion poignet) : 1=mi-course | 2=fin de course
- neck (cou) : 1=0–10° | 2=10–20° | 3=>20° | 4=extension | 5=incliné | 6=tordu
- trunk (tronc) : 1=droit | 2=0–20° | 3=20–60° | 4=>60° | 5=incliné | 6=tordu
- legs (jambes) : 1=appui stable | 2=appui instable
- muscleA (contraction statique/répétée) : 0=non | 1=oui
- forceA (force/charge) : 0=<2kg | 1=2–10kg ponctuel | 2=2–10kg répété | 3=>10kg ou choc

REBA :
- neck : 1=0–20° | 2=>20° ou extension | 3=+torsion/inclinaison
- trunk : 1=droit | 2=0–20° | 3=20–60° | 4=>60° | 5=+torsion
- legs : 1=appui bilatéral | 2=unilatéral | 3=flexion 30–60° | 4=flexion >60°
- load : 0=<5kg | 1=5–10kg | 2=>10kg | 3=+à-coups
- ua (bras) : 1=±20° | 2=>20° ou 45° | 3=45–90° | 4=>90° | 5=épaule surélevée | 6=bras en appui
- la (avant-bras) : 1=60–100° | 2=<60° ou >100°
- wr (poignet) : 1=0–15° | 2=>15° | 3=+torsion
- coupling (préhension) : 0=bonne | 1=moyenne | 2=mauvaise | 3=inacceptable
- activity : 0=aucune | 1=statique >1 min | 2=répétée | 3=instable/rapide

Si un segment n’est pas visible ou non évaluable, ne l’inclus pas.
Réponds UNIQUEMENT par un objet JSON valide, sans aucun texte autour :
{"rula":{...},"reba":{...},"commentaire":"une phrase : posture dominante, segments les plus à risque, et rappel que la photo donne une estimation à confirmer sur le terrain"}`;
  const body={model:VISION_CFG.model,max_tokens:1200,messages:[{role:'user',content:[
    {type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},
    {type:'text',text:prompt}]}]};
  fetch(VISION_CFG.url,{method:'POST',headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({token:VISION_CFG.token,payload:JSON.stringify(body)})})
  .then(res=>{if(!res.ok)throw new Error('HTTP '+res.status);return res.text();})
  .then(raw=>{
    let data;try{data=JSON.parse(raw);}catch(_){data=null;}
    let txt='';
    if(data&&Array.isArray(data.content))txt=data.content.filter(x=>x.type==='text').map(x=>x.text).join('\n');
    else if(data&&typeof data.text==='string')txt=data.text;
    else if(data&&typeof data.completion==='string')txt=data.completion;
    else txt=raw;
    const clean=String(txt).replace(/```json/gi,'').replace(/```/g,'').trim();
    const a=clean.indexOf('{'),b=clean.lastIndexOf('}');
    if(a<0||b<0)throw new Error('pas de JSON exploitable');
    const obj=JSON.parse(clean.slice(a,b+1));
    const n=applyIaAngles(obj);
    E.ergoPhotoNote='🔍 Analyse IA — '+(obj.commentaire||'angulations proposées, à vérifier sur le terrain.')+(n?` (${n} segment(s) pré-rempli(s))`:'');
    rErgo();
    setStatus('✅ Angulations pré-remplies. Vérifie et ajuste chaque valeur ci-dessous.','var(--teal-600)');
  })
  .catch(e=>{
    setStatus('⚠️ Analyse indisponible ('+esc(e.message)+'). Vérifie l’URL et le token du webhook vision, ou renseigne les angulations manuellement.','var(--orange-600)');
  });
}

function wireCombo(kind){
  const wrap=document.querySelector(`.combo[data-kind="${kind}"]`);if(!wrap)return;
  const inp=wrap.querySelector('.combo-input'),drop=wrap.querySelector('.drop');
  const data=kind==='naf'?NAF:PCS;
  function search(q){
    q=q.trim().toLowerCase();
    let res= !q?data.slice(0,12):data.filter(x=>x.lib.toLowerCase().includes(q)||x.code.toLowerCase().includes(q)||(x.kw||'').toLowerCase().includes(q)).slice(0,30);
    drop.innerHTML=res.length?res.map(x=>`<div class="opt" data-kind="${kind}" data-code="${esc(x.code)}"><span class="code">${esc(x.code)}</span><span class="lib">${esc(x.lib)}<small>${secLabel(x.sec)}</small></span></div>`).join(''):`<div class="empty">Aucun résultat pour « ${esc(q)} »</div>`;
    drop.classList.add('on');
  }
  inp.addEventListener('focus',()=>search(inp.value));
  inp.addEventListener('input',()=>search(inp.value));
  inp.addEventListener('click',()=>search(inp.value));
}
/* Délégation globale UNIQUE (évite l'accumulation de listeners à chaque re-render) */
if(!window.__comboWired){
  window.__comboWired=true;
  // Sélection d'une option — mousedown se déclenche AVANT blur/click, marche partout (souris + tactile)
  document.addEventListener('mousedown',e=>{
    const opt=e.target.closest('.opt[data-kind]');
    if(opt){e.preventDefault();pickCode(opt.dataset.kind,opt.dataset.code);}
  });
  // Fallback tactile pour navigateurs qui n'émettent pas mousedown au touch
  document.addEventListener('touchstart',e=>{
    const opt=e.target.closest('.opt[data-kind]');
    if(opt){e.preventDefault();pickCode(opt.dataset.kind,opt.dataset.code);}
  },{passive:false});
  // Fermeture au clic hors de tout combo
  document.addEventListener('click',e=>{
    document.querySelectorAll('.combo').forEach(c=>{
      if(!c.contains(e.target))c.querySelector('.drop')?.classList.remove('on');
    });
  });
}
function secLabel(s){return ({sante:'Santé',aide_domicile:'Aide à domicile',petite_enfance:'Petite enfance',commerce:'Commerce',logistique:'Logistique',transport:'Transport',btp:'BTP',hcr:'Hôtellerie-restauration',agroalim:'Agroalimentaire',industrie:'Industrie',agriculture:'Agriculture',espaces_verts:'Espaces verts',proprete:'Propreté',coiffure:'Coiffure/beauté',securite:'Sécurité',dechets:'Déchets',enseignement:'Enseignement',tertiaire:'Tertiaire'}[s]||s||'');}
function pickCode(kind,code){
  const data=kind==='naf'?NAF:PCS;const x=data.find(d=>d.code===code);if(!x)return;
  if(kind==='naf'){E.poste.naf=x.code;E.poste.nafLib=x.lib;}
  else{E.poste.pcs=x.code;E.poste.metier=x.lib;E.poste.pcsLib=x.lib;}
  if(x.sec&&PROFILS[x.sec])E.poste.secteur=x.sec;
  rPoste();renderRail();updateFoot();
}
function clearCode(kind){if(kind==='naf'){E.poste.naf='';E.poste.nafLib='';}else{E.poste.pcs='';E.poste.metier='';E.poste.pcsLib='';}rPoste();}
function appliquerProfil(silent){
  const pr=PROFILS[E.poste.secteur];if(!pr){alert('Sélectionne d’abord un code NAF ou PCS reconnu.');return;}
  FAMILLES.forEach(f=>{const base=pr.familles[f.key]??0;E.risques[f.key]=f.items.map(()=>base);});
  if(!E.taches.length)pr.taches.forEach(t=>E.taches.push({nom:t[0],temps:t[1],effort:t[2],frequence:t[3],risque:t[4],compat:'ok',adaptation:''}));
  pr.capacites.forEach(d=>{if(CAPACITES.includes(d)&&!E.capacites[d])E.capacites[d]='adapt';});
  renderRail();
  if(!silent){const z=document.getElementById('propoZone');if(z)z.innerHTML='<div class="notice" style="margin-top:6px;background:oklch(0.94 0.06 150);border-color:oklch(0.8 0.1 150);color:oklch(0.4 0.1 150)">✅ Profil appliqué : familles pré-cotées, tâches et contraintes proposées. Ajuste dans les étapes suivantes.</div>';}
  else drawFamilles&&document.getElementById('famList')&&drawFamilles();
}

  r.onload=()=>{try{const d=JSON.parse(r.result);Object.assign(E,d);
    if(!E.risques)E.risques=blankFamilles();FAMILLES.forEach(fm=>{if(!Array.isArray(E.risques[fm.key]))E.risques[fm.key]=fm.items.map(()=>0);});
    if(!E.taches)E.taches=[];if(!E.capacites)E.capacites={};
    step=0;render();}catch(e){alert('Fichier illisible.');}};
  r.readAsText(f);ev.target.value='';
}
function resetAll(){if(!confirm('Démarrer une nouvelle étude ? Les données non enregistrées seront perdues.'))return;
  Object.assign(E,{taches:[],risques:blankFamilles(),capacites:{},envNote:'',ergoPhoto:'',ergoPhotoNote:''});
  E.poste={entreprise:'',service:'',activite:'',naf:'',nafLib:'',metier:'',pcs:'',pcsLib:'',secteur:'',date:new Date().toISOString().slice(0,10),preventeur:'',effectif:'',horaires:'',contexte:''};
  E.ergo={rula:{ua:1,la:1,wr:1,tw:1,neck:1,trunk:1,legs:1,muscleA:0,forceA:0,muscleB:0,forceB:0},reba:{neck:1,trunk:1,legs:1,load:0,ua:1,la:1,wr:1,coupling:0,activity:0},niosh:{poids:0,H:40,V:75,D:50,A:0,F:'0.2',C:'bonne'}};
  step=0;render();}

/* =========================================================
   NAVIGATION & UTILITAIRES
   ========================================================= */
function setP(k,v){E.poste[k]=v;renderRail();updateFoot();}
function go(dir){const n=step+dir;if(n<0)return;if(n>=STEPS.length){step=STEPS.length-1;rtab='synth';render();return;}step=n;render();}
function jump(i){step=i;render();}
function toggleRail(open){const r=document.getElementById('rail'),s=document.getElementById('scrim');
  if(open===undefined)open=!r.classList.contains('open');r.classList.toggle('open',open);s.classList.toggle('on',open);}

/* ---- init ---- */
render();
</script>
